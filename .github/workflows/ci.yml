---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          core='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          release_tag_pattern="^v${core}\.${core}\.${core}(-${prerelease_identifier}(\.${prerelease_identifier})*)?$"
          if [[ ! "${GITHUB_REF_NAME}" =~ ${release_tag_pattern} ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' -t go_files < <(git ls-files -z -- "*.go")
          formatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "${formatted}" ]]; then
            echo "The following files need gofmt:"
            echo "${formatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -cover ./...

      - name: Build binary
        shell: bash
        run: |
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=ci -X main.commit=${GITHUB_SHA} -X main.buildDate=${build_date}" \
            -o "${RUNNER_TEMP}/vertiv_exporter" \
            ./cmd/vertiv_exporter
          "${RUNNER_TEMP}/vertiv_exporter" --version

  container_smoke:
    name: Container smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
          - name: arm64
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve build metadata
        id: build_info
        shell: bash
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Build test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: vertiv-exporter:ci-${{ matrix.name }}
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_info.outputs.created }}
          cache-from: type=gha,scope=container-smoke-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=container-smoke-${{ matrix.name }}

      - name: Test image
        run: docker run --rm --platform "${{ matrix.platform }}" "vertiv-exporter:ci-${{ matrix.name }}" --version

  publish_image:
    name: Publish container image
    runs-on: ubuntu-latest
    needs:
      - test
      - container_smoke
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Resolve build metadata
        id: build_info
        shell: bash
        env:
          METADATA_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          version="${METADATA_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          created="$(date -u -d "@${source_date_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          echo "created=${created}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.build_info.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_info.outputs.created }}
          cache-from: type=gha,scope=container-publish
          cache-to: type=gha,mode=max,scope=container-publish
          provenance: mode=max
          sbom: true

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "### Published container image"
            printf -- "- Image: %s\n" "${{ steps.image.outputs.name }}"
            printf -- "- Digest: %s\n" "${{ steps.build.outputs.digest }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish_release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - publish_image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build release archives
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          source_date_epoch="$(git show -s --format=%ct "${RELEASE_COMMIT}")"
          build_date="$(date -u -d "@${source_date_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"

          go mod download
          mkdir -p dist

          for goarch in amd64 arm64; do
            package_name="vertiv_exporter-${release_version}.linux-${goarch}"
            package_dir="${RUNNER_TEMP}/${package_name}"
            mkdir -p "${package_dir}"

            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${release_version} -X main.commit=${RELEASE_COMMIT} -X main.buildDate=${build_date}" \
              -o "${package_dir}/vertiv_exporter" \
              ./cmd/vertiv_exporter

            install -m 0644 \
              README.md \
              config.example.yaml \
              packaging/systemd/vertiv_exporter.service \
              "${package_dir}/"

            tar \
              --sort=name \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --mtime="@${source_date_epoch}" \
              -C "${RUNNER_TEMP}" \
              -czf "dist/${package_name}.tar.gz" \
              "${package_name}"
          done

          version_output="$("${RUNNER_TEMP}/vertiv_exporter-${release_version}.linux-amd64/vertiv_exporter" --version)"
          echo "${version_output}"
          if [[ "${version_output}" != *"version=${release_version}"* || "${version_output}" != *"commit=${RELEASE_COMMIT}"* ]]; then
            echo "Release binary version metadata is incorrect."
            exit 1
          fi

          (
            cd dist
            sha256sum *.tar.gz > sha256sums.txt
            sha256sum --check sha256sums.txt
          )

      - name: Create GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          prerelease_args=()
          version_without_build="${RELEASE_TAG%%+*}"
          if [[ "${version_without_build}" == *-* ]]; then
            prerelease_args+=(--prerelease --latest=false)
          fi

          gh release create "${RELEASE_TAG}" \
            dist/*.tar.gz \
            dist/sha256sums.txt \
            --verify-tag \
            --generate-notes \
            --title "vertiv_exporter ${RELEASE_TAG}" \
            "${prerelease_args[@]}"
