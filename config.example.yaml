exporter:
  listen_address: ":9101"
  metrics_path: "/metrics"
  scrape_timeout: 10s
  metrics_file: ""
  debug_response: false

targets:
  - name: "dc-rack-01"
    host: "https://vertiv.example.invalid"
    username: "CHANGE_ME_USERNAME"
    password: "CHANGE_ME_PASSWORD"
    tls_skip_verify: true
    devices:
      - name: "AC1"
        type: "ac"
        equip_id: 23
      - name: "ENV_THD"
        type: "thd"
        equip_id: -98
      - name: "UPS_1"
        type: "ups"
        equip_id: 26
