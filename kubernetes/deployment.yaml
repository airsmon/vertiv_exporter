# Replace the example Vertiv host and device IDs before applying this manifest.
# Create the required vertiv-exporter-credentials Secret separately; see README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vertiv-exporter-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vertiv-exporter
    app.kubernetes.io/component: exporter
data:
  config.yaml: |
    exporter:
      listen_address: ":9101"
      metrics_path: "/metrics"
      scrape_timeout: 10s
      metrics_file: ""
      debug_response: false

    targets:
      - name: "example-site"
        host: "https://vertiv.example.invalid"
        tls_skip_verify: false
        devices:
          # Replace these example IDs with values from the target Vertiv CGI requests.
          - name: "AC_1"
            type: "ac"
            equip_id: 23
          - name: "ENV_THD"
            type: "thd"
            equip_id: -98
          - name: "UPS_1"
            type: "ups"
            equip_id: 26
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vertiv-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vertiv-exporter
    app.kubernetes.io/component: exporter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertiv-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vertiv-exporter
    app.kubernetes.io/instance: vertiv-exporter
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vertiv-exporter
      app.kubernetes.io/instance: vertiv-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vertiv-exporter
        app.kubernetes.io/instance: vertiv-exporter
        app.kubernetes.io/version: "1.0.1"
        app.kubernetes.io/component: exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9101"
    spec:
      serviceAccountName: vertiv-exporter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vertiv-exporter
          image: ghcr.io/airsmon/vertiv_exporter:v1.0.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/vertiv-exporter/config.yaml
          env:
            - name: VERTIV_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vertiv-exporter-credentials
                  key: username
            - name: VERTIV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vertiv-exporter-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/vertiv-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vertiv-exporter-config
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: vertiv-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vertiv-exporter
    app.kubernetes.io/instance: vertiv-exporter
    app.kubernetes.io/component: exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vertiv-exporter
    app.kubernetes.io/instance: vertiv-exporter
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
      protocol: TCP
